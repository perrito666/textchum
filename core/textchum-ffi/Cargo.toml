[package]
name = "textchum-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over textchum-core, consumed by platform shells."
build = "build.rs"

[lib]
name = "textchum"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1.0.151"
textchum-core = { path = "../textchum-core" }
textchum-lsp = { path = "../textchum-lsp" }

[build-dependencies]
cbindgen = "0.29"
