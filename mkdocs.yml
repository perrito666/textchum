site_name: Textchum
site_url: https://perrito666.github.io/textchum/
site_description: A fast, native text editor for macOS with a portable compiled core.
repo_url: https://github.com/perrito666/textchum
repo_name: perrito666/textchum

theme:
  name: material
  features:
    - navigation.footer
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  # Lets the paired screenshots in the tour hold ordinary Markdown
  # images inside a <div>. Written as raw <img> tags instead, their
  # paths would be left alone — MkDocs rewrites relative links while
  # walking the Markdown tree, and raw HTML never enters it, so the
  # translated pages (one directory deeper) would point at nothing.
  - md_in_html

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Tour: Recorrido
            Architecture: Arquitectura
            Documents: Documentos
            Search: Búsqueda
            Highlighting: Coloreado
            Markdown: Markdown
            Language servers: Servidores de lenguaje
            Language setups: Recetas por lenguaje
            The navigator: El navegador
            Configuration: Configuración
            The C boundary: La frontera C
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Getting started: Premiers pas
            Tour: Visite
            Architecture: Architecture
            Documents: Documents
            Search: Recherche
            Highlighting: Coloration
            Markdown: Markdown
            Language servers: Serveurs de langage
            Language setups: Recettes par langage
            The navigator: Le navigateur
            Configuration: Configuration
            The C boundary: La frontière C

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tour: tour.md
  - Architecture: architecture.md
  - Documents: documents.md
  - Search: search.md
  - Highlighting: highlighting.md
  - Markdown: markdown.md
  - Language servers: language-servers.md
  - Language setups: language-setups.md
  - The navigator: navigator.md
  - Configuration: configuration.md
  - The C boundary: ffi.md
