site_name: Textchum
site_description: A fast, native text editor for macOS with a portable compiled core.
repo_url: https://github.com/perrito666/textchum
repo_name: perrito666/textchum

theme:
  name: material
  features:
    - navigation.footer
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            Architecture: Arquitectura
            Documents: Documentos
            Highlighting: Coloreado
            Markdown: Markdown
            Language servers: Servidores de lenguaje
            The navigator: El navegador
            Configuration: Configuración
            The C boundary: La frontera C
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Getting started: Premiers pas
            Architecture: Architecture
            Documents: Documents
            Highlighting: Coloration
            Markdown: Markdown
            Language servers: Serveurs de langage
            The navigator: Le navigateur
            Configuration: Configuration
            The C boundary: La frontière C

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Documents: documents.md
  - Highlighting: highlighting.md
  - Markdown: markdown.md
  - Language servers: language-servers.md
  - The navigator: navigator.md
  - Configuration: configuration.md
  - The C boundary: ffi.md
