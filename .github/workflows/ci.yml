name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit, Mondays 06:00 UTC — advisories appear for
    # dependencies that have not changed.
    - cron: "0 6 * * 1"

# Third-party actions are pinned to commit SHAs (tag comments alongside):
# a moved tag cannot inject code into this pipeline.
jobs:
  build-and-test:
    name: Core & app (macOS)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - name: Tests, smoke test, header drift
        run: make check

  docs:
    name: Documentation site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build site (en/es/fr)
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-audit
      - name: RustSec advisories (core)
        run: cargo audit
        working-directory: core
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: PyPI advisories (docs toolchain)
        run: |
          pip install -r docs/requirements.txt pip-audit
          pip-audit
