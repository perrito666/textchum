name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**.md"

# Superseded runs are wasted minutes; keep only the newest per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to commit SHAs (tag comments alongside):
# a moved tag cannot inject code into this pipeline.
#
# Cost note: macOS minutes bill at 10x, so the macOS job does only what
# needs a Mac (Swift build + smoke test); the portable core tests run on
# Linux at 1x.
jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - name: Rust test suite
        run: cargo test --manifest-path core/Cargo.toml
      - name: Header drift check
        run: make header-check

  linux-shell:
    name: GTK shell build & smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: linux
      - name: GTK toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev xvfb
      - name: Build
        run: cargo build --manifest-path linux/Cargo.toml
      - name: Smoke test (headless)
        env:
          # WebKit's bubblewrap sandbox needs unprivileged user
          # namespaces, which some runner images deny; without this the
          # web process dies and GLib aborts the smoke test. Headless
          # CI only — never set for users.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: xvfb-run -a linux/target/debug/textchum-gtk --smoke-test

  macos-app:
    name: App build & smoke (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - name: Build app and run smoke test
        run: make smoke
