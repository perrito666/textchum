name: Release

on:
  push:
    tags: ["v*"]

# The release step publishes with the built-in GITHUB_TOKEN via the gh
# CLI the runner ships — no third-party release action to pin or trust.
permissions:
  contents: write

# Cost note: macOS minutes bill at 10x, but a release is rare and needs
# a Mac end to end (release core, release Swift build, icns, ditto).
jobs:
  release:
    name: Build app & publish release
    runs-on: macos-15
    # Code signing and notarization switch on by themselves once the
    # four secrets exist (Settings → Secrets and variables → Actions):
    #   MACOS_CERTIFICATE_P12      Developer ID Application cert, base64 of the .p12
    #   MACOS_CERTIFICATE_PASSWORD the .p12's password
    #   APPLE_API_KEY_P8           App Store Connect API key (.p8 contents)
    #   APPLE_API_KEY_ID           its Key ID
    #   APPLE_API_ISSUER_ID        the issuer UUID
    # Until then the steps skip and the zip ships unsigned, as before.
    env:
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core

      - name: Test before shipping
        run: make check

      - name: Build the app bundle
        run: make app

      - name: Stamp the tag's version into the bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/Textchum.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" dist/Textchum.app/Contents/Info.plist

      - name: Sign the app
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          test -n "$IDENTITY"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" dist/Textchum.app
          codesign --verify --deep --strict dist/Textchum.app

      - name: Notarize and staple
        if: env.HAVE_SIGNING == 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent dist/Textchum.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" --wait
          xcrun stapler staple dist/Textchum.app

      - name: Zip the bundle
        # ditto preserves the bundle structure and extended attributes
        # the way Archive Utility expects.
        run: |
          ditto -c -k --keepParent dist/Textchum.app "Textchum-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Textchum-${GITHUB_REF_NAME}.zip" > "Textchum-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Textchum $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "macOS: the app is not code-signed — on first launch, right-click Textchum.app and choose Open (or clear quarantine with \`xattr -d com.apple.quarantine Textchum.app\`); requires macOS 14+ on Apple Silicon. Linux: the textchum-gtk tarballs need GTK 4.14+, libadwaita 1.5+, GtkSourceView 5, and WebKitGTK 6 at runtime (Ubuntu 24.04+, Fedora 40+)." \
            "Textchum-${GITHUB_REF_NAME}.zip" \
            "Textchum-${GITHUB_REF_NAME}.zip.sha256"

  linux:
    name: Linux binary (${{ matrix.arch }})
    needs: release
    strategy:
      # One arch failing should not cancel the other's upload.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: linux
      - name: GTK toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libwebkitgtk-6.0-dev xvfb
      - name: Build and smoke test
        env:
          # WebKit's bubblewrap sandbox needs unprivileged user
          # namespaces, which some runner images deny (the arm pool
          # does); without this the web process dies and GLib aborts
          # the smoke test. Headless CI only — never set for users.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          cargo build --release --manifest-path linux/Cargo.toml
          xvfb-run -a linux/target/release/textchum-gtk --smoke-test
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARBALL="textchum-gtk-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz"
          tar -C linux/target/release -czf "$TARBALL" textchum-gtk
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          gh release upload "$GITHUB_REF_NAME" "$TARBALL" "$TARBALL.sha256"
